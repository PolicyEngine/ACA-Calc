name: Modal API

# Tests the Modal backend against the image's pinned packages on pull requests
# that touch it, and deploys it to PolicyEngine's Modal workspace on merge.

on:
  pull_request:
    paths:
      - modal_app.py
      - modal-requirements.txt
      - aca_calc/**
      - src/aca_api/**
      - tests/test_api_explain.py
      - tests/test_modal_requirements.py
      - scripts/smoke_test_api.py
      - .github/workflows/modal-api.yml
  push:
    branches: [main]
    paths:
      - modal_app.py
      - modal-requirements.txt
      - aca_calc/**
      - src/aca_api/**
      - tests/test_api_explain.py
      - tests/test_modal_requirements.py
      - scripts/smoke_test_api.py
      - .github/workflows/modal-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-api-${{ github.ref }}
  cancel-in-progress: false

env:
  API_URL: https://policyengine--aca-calc-api-fastapi-app.modal.run
  MODAL_VERSION: 1.4.2
  UV_VERSION: 0.11.7

jobs:
  test:
    name: Test with the image's packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the packages pinned for the Modal image
        run: |
          uv venv --python 3.11
          uv pip install -r modal-requirements.txt
      - name: Run the API tests
        run: .venv/bin/python -m pytest tests/test_api_explain.py tests/test_modal_requirements.py

  deploy:
    name: Deploy and smoke-test
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Deploy aca-calc-api
        run: uvx --from "modal==$MODAL_VERSION" modal deploy --env main modal_app.py
      - name: Smoke-test the calculator
        id: calculator
        run: uv run --no-project --python 3.11 scripts/smoke_test_api.py "$API_URL"
      - name: Roll back to the previous version if the calculator fails
        if: failure() && steps.calculator.outcome == 'failure'
        run: uvx --from "modal==$MODAL_VERSION" modal app rollback aca-calc-api --env main
      # Calls the Anthropic API unless this household's answer is cached.
      - name: Smoke-test AI explanations
        run: uv run --no-project --python 3.11 scripts/smoke_test_api.py "$API_URL" --explain
